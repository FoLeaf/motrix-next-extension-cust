name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run extension tests
        run: npm test

      - name: Package Chromium and Firefox builds
        run: node scripts/package-release.mjs

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            .release/motrix-next-extension-chromium.zip \
            .release/motrix-next-extension-firefox.zip \
            .release/SHA256SUMS.txt \
            --clobber

      - name: Upload build artifacts (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: motrix-next-extension-packages
          path: |
            .release/motrix-next-extension-chromium.zip
            .release/motrix-next-extension-firefox.zip
            .release/SHA256SUMS.txt
          retention-days: 7
